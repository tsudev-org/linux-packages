name: xuat-ban
# Moi gio (va khi doi main): so goi can co voi kho dang phat hanh (buoc kiem chi doc API, vai giay). Co ban moi -> job `xuat-ban`
# chay trong Environment `packages` (CAN CHU PROJECT DUYET), ky bang khoa con, day len R2, roi cai
# THAT tu https://pkg.tsudev.com. Hong -> mo Issue.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xuat-ban
  cancel-in-progress: false
jobs:
  kiem:
    name: Co ban moi khong?
    runs-on: ubuntu-24.04
    outputs:
      can: ${{ steps.so.outputs.can }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: so
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/dung_kho.py plan --out moi.json
          curl -fsSL https://pkg.tsudev.com/manifest.json -o cu.json || echo '{"files":[]}' > cu.json
          if [ "${{ github.event_name }}" != schedule ] || ! python3 -c 'import json,sys; sys.exit(json.load(open("moi.json"))["files"] != json.load(open("cu.json"))["files"])'; then
            echo "can=true" >> "$GITHUB_OUTPUT"; echo "Can xuat ban"
          else
            echo "can=false" >> "$GITHUB_OUTPUT"; echo "Kho da moi nhat"
          fi

  xuat-ban:
    name: Ky va day len pkg.tsudev.com
    needs: kiem
    # Chua co khoa (vars.PKG_GPG_FINGERPRINT rong) thi khong xuat ban.
    if: needs.kiem.outputs.can == 'true' && vars.PKG_GPG_FINGERPRINT != ''
    runs-on: ubuntu-24.04
    environment: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cai cong cu
        run: tools/cai-cong-cu.sh
      - name: Nap khoa con ky
        env:
          PKG_GPG_SIGNING_KEY: ${{ secrets.PKG_GPG_SIGNING_KEY }}
          FPR: ${{ vars.PKG_GPG_FINGERPRINT }}
        run: |
          test -n "$FPR" && test -s keys/tsudev-archive-keyring.gpg
          gpg --show-keys --with-colons keys/tsudev-archive-keyring.gpg | grep -q "^fpr:::::::::$FPR:" \
            || { echo "Van tay vars.PKG_GPG_FINGERPRINT khong khop keys/"; exit 1; }
          printf '%s\n' "$PKG_GPG_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys "$FPR" | grep -q '^sec#' || { echo "Secret chua ca khoa chinh - chi duoc nap khoa con"; exit 1; }
      - name: Dung kho
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FPR: ${{ vars.PKG_GPG_FINGERPRINT }}
        run: |
          python3 tools/dung_kho.py build --out site --key "$FPR" --reuse-from https://pkg.tsudev.com
          cmp keys/tsudev-archive-keyring.gpg site/tsudev-archive-keyring.gpg
          python3 -c 'import json,sys; sys.exit(json.load(open("site/catalog.json"))["key"]["fingerprint"] != sys.argv[1].upper())' "$FPR" \
            || { echo "catalog.json ghi sai van tay khoa"; exit 1; }
          gpgv --keyring site/tsudev-archive-keyring.gpg site/apt/dists/stable/InRelease
          gpgv --keyring site/tsudev-archive-keyring.gpg site/rpm/repodata/repomd.xml.asc site/rpm/repodata/repomd.xml
      - name: Day len R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: tools/day-len-r2.sh site
      - name: Xoa khoa khoi runner
        if: always()
        run: rm -rf ~/.gnupg

  kiem-cai-that:
    # Cai THAT tu https://pkg.tsudev.com tren du 5 ban phan phoi nhu CI cua PR, va tren may ARM64 (chi goi co
    # ban arm64 - doc tu catalog.json dang phat hanh).
    name: Cai that ${{ matrix.image }} ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || '' }}
    needs: xuat-ban
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
        image: ['ubuntu:24.04', 'ubuntu:22.04', 'debian:12', 'debian:13', 'fedora:latest']
        include:
          - { runner: ubuntu-24.04-arm, image: 'ubuntu:24.04' }
          - { runner: ubuntu-24.04-arm, image: 'debian:12' }
          - { runner: ubuntu-24.04-arm, image: 'fedora:latest' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cai that tu pkg.tsudev.com
        shell: bash
        run: |
          case "${{ matrix.image }}" in fedora*) kind=rpm ;; *) kind=apt ;; esac
          if [ $kind = apt ]; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 curl ca-certificates >/dev/null
          else
            dnf install -y -q python3 curl findutils >/dev/null
          fi
          arch=$(uname -m)
          mapfile -t pkgs < <(curl -fsSL https://pkg.tsudev.com/catalog.json | python3 -c '
          import json, sys
          a = {"x86_64": "x64", "aarch64": "arm64"}[sys.argv[1]]
          print("\n".join(p["name"] for p in json.load(sys.stdin)["packages"] if a in p["arch"]))' "$arch")
          if [ ${#pkgs[@]} -eq 0 ]; then echo "::notice::Khong co goi $arch - bo qua"; exit 0; fi
          bash tools/kiem-cai.sh $kind https://pkg.tsudev.com "${pkgs[@]}"

  bao-loi:
    name: Mo Issue khi cai that hong
    needs: [xuat-ban, kiem-cai-that]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" --title "Xuat ban / cai that pkg.tsudev.com hong ($(date -u +%d/%m/%Y))" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
