# linux-packages: OpenSSF Scorecard - chấm điểm thực hành bảo mật chuỗi cung ứng (bảo vệ nhánh, ghim SHA, quyền token,
# review...) và đẩy SARIF vào Security > Code scanning (category "scorecard"). Chép từ mẫu của repo tsudev
# (phiếu 20261113-03, P1.3). KHÔNG phải cổng PR: chạy trên `main` và theo lịch để thấy điểm trôi theo thời gian;
# không thêm vào ruleset. Chỉ tải SARIF lên - CodeQL dùng default setup của org.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 2'   # 10:41 thứ Ba giờ Việt Nam
  workflow_dispatch:
  # Cho phép check "Branch-Protection" đọc cấu hình của chính nó.
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Tải SARIF vào code scanning.
      security-events: write
      # Ký kết quả khi công bố lên api.securityscorecards.dev (repo Public, cần cho huy hiệu README).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
          category: scorecard
